server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do React Router (/projects/new, /projects/:id/edit):
    # se o arquivo não existir, entrega o index.html e o router resolve
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos gerados pelo Vite têm hash no nome, então podem ficar em cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
