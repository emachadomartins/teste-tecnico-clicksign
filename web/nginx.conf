server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Repassa /api/* para o container da API, removendo o prefixo /api.
    # Assim o navegador chama a API no mesmo endereço do front, sem CORS.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A API aceita capas de até 5 MB; o padrão do nginx é 1 MB
        client_max_body_size 6m;
    }

    # Rotas do React Router (/projects/new, /projects/:id/edit):
    # se o arquivo não existir, entrega o index.html e o router resolve
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos gerados pelo Vite têm hash no nome, então podem ficar em cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
