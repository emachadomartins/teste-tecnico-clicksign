server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O site é publicado em /docs. O Tailscale Funnel tira esse prefixo antes
    # de repassar, mas o acesso direto (localhost:4000/docs/) chega com ele.
    # Tirando o prefixo aqui também, os dois caminhos funcionam.
    rewrite ^/docs/?(.*)$ /$1 last;

    # O site usa URLs sem extensão (/api, /deploy), e os arquivos são .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Arquivos gerados pelo VitePress têm hash no nome, então podem ficar em cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
